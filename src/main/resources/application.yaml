spring:
  application:
    name: vault-ledger

  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: "classpath:db/migration"

bootstrap:
  system-vault:
    username: ${SYSTEM_VAULT_USERNAME}
    password: ${SYSTEM_VAULT_PASSWORD}

  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

server:
  port: 8080