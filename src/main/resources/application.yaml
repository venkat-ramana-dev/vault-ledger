spring:
  application:
    name: vault-ledger

  datasource:
    url: jdbc:postgresql://localhost:5432/vault_ledger
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: "classpath:db/migration"

server:
  port: 8081