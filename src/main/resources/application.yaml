spring:
  application:
    name: vault-ledger

  datasource:
    url: jdbc:postgresql://localhost:5433/vault_ledger
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

jwt:
  secret: 9e7c2f5d8a1b4e6f9c3d7a8b5e1f4c6d9a2b7e5c8f1d3a6b9e4f7c2d5a8b1e6
  expiration: 3600000

  flyway:
    enabled: true
    locations: "classpath:db/migration"

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: 8081